name: isup-monitor

services:
  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "alembic upgrade head && exec uvicorn src.web.app:app --host 0.0.0.0 --port 8000"]
    command: []
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    profiles: ["parser"]
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 30s
    shm_size: "512m"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:?Укажите DB_USER в .env}
      POSTGRES_PASSWORD: ${DB_PASS:?Укажите DB_PASS в .env}
      POSTGRES_DB: ${DB_NAME:?Укажите DB_NAME в .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
