<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ИСУП Монитор{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='dashboard.css').path }}">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="/">ИСУП Монитор</a>
    {% if user %}
      <nav aria-label="Основное меню">
        {% if user.role != 'guest' %}
          <a href="/analytics/summary">Сводка</a>
          <a href="/">Объекты</a>
          <a href="/analytics/problems">Проблемные</a>
          <a href="/analytics/completeness">Полнота данных</a>
          <a href="/participants">Участники и подписи</a>
        {% endif %}
        {% if user.role == 'admin' %}
          <a href="/admin/assignments">Закрепления</a>
          <a href="/admin/regulations">Правила светофора</a>
          <a href="/admin/users">Пользователи</a>
          <a href="/admin/ingestions">Журнал выгрузок</a>
        {% endif %}
      </nav>
      <form method="post" action="/logout" class="account">
        <span>{{ user.name }}</span>
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit" class="secondary">Выйти</button>
      </form>
    {% endif %}
  </div>
</header>
<main class="{% block layout %}container{% endblock %}">
  {% block content %}{% endblock %}
</main>
</body>
</html>
